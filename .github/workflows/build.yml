name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: build.bat

      - name: Check output exists
        shell: pwsh
        run: |
          if (-not (Test-Path HumanTyper.exe)) { throw "HumanTyper.exe was not produced" }
          Get-Item HumanTyper.exe | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanTyper
          path: HumanTyper.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HumanTyper.exe
          generate_release_notes: true
